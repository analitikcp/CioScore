name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5.1 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Proje klasörünü bul
        shell: bash
        run: |
          echo "=== REPO ==="
          pwd
          find . -maxdepth 3 -type f -name "settings.gradle.kts" -print

          if [ -f "./settings.gradle.kts" ] && [ -d "./app" ]; then
            echo "ROOT PROJE BULUNDU"
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(find . -type f -name "settings.gradle.kts" -print0 \
              | xargs -0 -n1 dirname \
              | while read d; do
                  [ -d "$d/app" ] && echo "$d" && break
                done)

            if [ -z "$PROJECT_DIR" ]; then
              echo "HATA: Android proje klasörü bulunamadı!"
              find . -maxdepth 4 -print
              exit 1
            fi

            echo "PROJE BULUNDU: $PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Proje yapısını kontrol et
        run: |
          echo "=== PROJE ==="
          cd "$PROJECT_DIR"
          pwd
          ls -la
          test -d app
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "PROJE YAPISI OK"

      - name: APK derle
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: APK kontrol
        run: |
          cd "$PROJECT_DIR"
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: CIO-Score-0.8.9-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
