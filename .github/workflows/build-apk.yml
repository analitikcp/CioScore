name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5.1 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: SADECE FINAL ZIP'i aç
        shell: bash
        run: |
          set -euo pipefail

          ZIP="./CIO_SCORE_FINAL.zip"

          echo "=== KULLANILAN ZIP ==="
          echo "$ZIP"

          test -f "$ZIP" || {
            echo "HATA: $ZIP bulunamadı."
            exit 1
          }

          rm -rf /tmp/cio_project
          mkdir -p /tmp/cio_project
          unzip -q "$ZIP" -d /tmp/cio_project

          PROJECT_DIR="/tmp/cio_project"
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/settings.gradle.kts" || test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || test -f "$PROJECT_DIR/app/build.gradle"

          test -f "$PROJECT_DIR/app/src/main/java/com/cio/skor/data/MatchMerger.kt"

          if grep -R "singleLine" -n "$PROJECT_DIR/app/src/main/java"; then
            echo "HATA: Kotlin kaynaklarında singleLine bulundu."
            exit 1
          fi

          echo "=== DOĞRU PROJE DOĞRULANDI ==="
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Proje kontrol
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          echo "=== PROJECT ==="
          pwd
          echo "=== MATCHMERGER ==="
          grep -n "object MatchMerger" app/src/main/java/com/cio/skor/data/MatchMerger.kt
          echo "=== MAINACTIVITY IMPORT ==="
          grep -n "import com.cio.skor.data.MatchMerger" app/src/main/java/com/cio/skor/MainActivity.kt

      - name: APK derle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          echo "=== APK DERLEME ==="
          gradle --no-daemon :app:assembleDebug

      - name: APK kontrol
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print -quit)
          test -n "$APK"
          echo "APK HAZIR: $APK"
          ls -lh "$APK"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: CIO-Score-6-Kaynak-FINAL-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
