name: CIO Skor APK

on:
  push:
    paths:
      - "CIO_Skor_APK_0_3_2.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Projeyi aç
        run: |
          rm -rf cio-project
          mkdir -p cio-project
          unzip -q CIO_Skor_APK_0_3_1.zip -d cio-project

          echo "=== PROJE DOSYALARI ==="
          find cio-project -maxdepth 3 -type f | sort

      - name: Gradle sürümünü kontrol et
        working-directory: cio-project
        run: |
          gradle --version

      - name: Android APK derle
        working-directory: cio-project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: CIO-Skor-0.3.1
          path: cio-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
