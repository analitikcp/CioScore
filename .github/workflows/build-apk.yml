    name: CIO Skor APK

on:
  workflow_dispatch:
  push:
    paths:
      - "CIO_Skor_APK_0_1_0.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: ZIP'i aç
        run: |
          rm -rf cio-project
          mkdir cio-project
          unzip -q CIO_Skor_APK_0_1_0.zip -d cio-project

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.5 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5"

      - name: Android APK derle
        working-directory: cio-project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: CIO-Skor-debug
          path: cio-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

    
