name: CIO Skor APK

on:
  push:
    paths:
      - "CIO_Skor_APK_0_2_1.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v5

      - name: Projeyi aç
        run: |
          rm -rf cio-project
          mkdir cio-project
          unzip -q CIO_Skor_APK_0_2_1.zip -d cio-project

          echo "=== PROJE DOSYALARI ==="
          find cio-project -maxdepth 4 -type f | sort

      - name: Gradle dosyasını bul
        id: project
        run: |
          BUILD_FILE=$(find cio-project -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "Gradle build dosyası bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          while [ "$PROJECT_DIR" != "cio-project" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; do
            PROJECT_DIR=$(dirname "$PROJECT_DIR")
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "=== PROJE KLASÖRÜ ==="
          echo "$PROJECT_DIR"

      - name: Android APK derle
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: CIO-Skor-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
