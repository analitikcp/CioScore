name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Android projesini bul
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/cio_project /tmp/cio_extract
          mkdir -p /tmp/cio_project /tmp/cio_extract

          PROJECT_DIR=""

          echo "=== REPO ==="
          pwd
          echo "=== ROOT ==="
          find . -maxdepth 2 -type f -print | sort | head -200

          # 1) Öncelik: repo kökünde doğrudan Android projesi.
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            if [ -f "app/build.gradle.kts" ] || [ -f "app/build.gradle" ]; then
              PROJECT_DIR="$PWD"
              echo "Android projesi repo kökünde bulundu."
            fi
          fi

          # 2) Kök proje yoksa, ZIP'lerin içinden GERÇEK Android projesini bul.
          if [ -z "$PROJECT_DIR" ]; then
            FOUND_COUNT=0
            FOUND_ZIP=""

            while IFS= read -r -d '' ZIP; do
              echo ""
              echo "ZIP kontrol ediliyor: $ZIP"

              rm -rf /tmp/cio_extract/*
              if ! unzip -q "$ZIP" -d /tmp/cio_extract; then
                echo "ZIP açılamadı, atlanıyor."
                continue
              fi

              APP_DIR="$(find /tmp/cio_extract -type d -name app -print -quit || true)"
              if [ -z "$APP_DIR" ]; then
                continue
              fi

              TEST_PROJECT="$(dirname "$APP_DIR")"

              if { [ -f "$TEST_PROJECT/settings.gradle.kts" ] || [ -f "$TEST_PROJECT/settings.gradle" ]; } &&                  { [ -f "$TEST_PROJECT/app/build.gradle.kts" ] || [ -f "$TEST_PROJECT/app/build.gradle" ]; }; then
                FOUND_COUNT=$((FOUND_COUNT + 1))
                FOUND_ZIP="$ZIP"
                echo "Android projesi bu ZIP içinde bulundu: $ZIP"
              fi
            done < <(find . -type f -iname '*.zip'               -not -path './.git/*'               -print0)

            if [ "$FOUND_COUNT" -ne 1 ]; then
              echo ""
              echo "HATA: Tam olarak 1 kullanılabilir Android ZIP'i bulunmalı."
              echo "Bulunan uygun ZIP sayısı: $FOUND_COUNT"
              echo ""
              echo "ZIP listesi:"
              find . -type f -iname '*.zip' -not -path './.git/*' -print
              exit 1
            fi

            rm -rf /tmp/cio_extract/*
            unzip -q "$FOUND_ZIP" -d /tmp/cio_extract

            APP_DIR="$(find /tmp/cio_extract -type d -name app -print -quit)"
            PROJECT_DIR="$(dirname "$APP_DIR")"

            cp -a "$PROJECT_DIR/." /tmp/cio_project/
            PROJECT_DIR="/tmp/cio_project"

            echo "ZIP'ten Android projesi çıkarıldı."
          else
            # Kök projeyi geçici klasöre kopyala; build çıktıları repo içine karışmasın.
            cp -a . /tmp/cio_project/
            PROJECT_DIR="/tmp/cio_project"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=== KULLANILAN PROJE ==="
          echo "$PROJECT_DIR"
          echo ""

          test -f "$PROJECT_DIR/settings.gradle.kts" || test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || test -f "$PROJECT_DIR/app/build.gradle"

          echo "=== APP ==="
          find "$PROJECT_DIR/app" -maxdepth 3 -type f -print | sort | head -200

      - name: APK derle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== APK DERLEME ==="
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK kontrol
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APK DOSYALARI ==="

          find "$PROJECT_DIR/app/build/outputs"             -type f             -name '*.apk'             -print

          APK="$(find "$PROJECT_DIR/app/build/outputs"             -type f             -name '*.apk'             -print -quit)"

          if [ -z "$APK" ]; then
            echo "HATA: APK oluşmadı!"
            exit 1
          fi

          echo ""
          echo "APK HAZIR:"
          ls -lh "$APK"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: CIO-Score-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
