name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5.1 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Projeyi bul
        shell: bash
        run: |
          echo "=== REPO ==="
          pwd
          echo "=== KLASÖRLER ==="
          find . -maxdepth 3 -type d -print

          if [ -d "./app" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "ROOT PROJE BULUNDU"
          elif [ -d "./CIO_Skor_APK_0_8_9_MAC_ESLESTIRME_4KAYNAK/app" ]; then
            echo "PROJECT_DIR=./CIO_Skor_APK_0_8_9_MAC_ESLESTIRME_4KAYNAK" >> "$GITHUB_ENV"
            echo "ALT KLASORDE PROJE BULUNDU"
          else
            echo "HATA: app klasoru bulunamadi!"
            exit 1
          fi

      - name: Proje yapisini kontrol et
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== PROJE ==="
          pwd
          ls -la

          test -d app
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

          echo "PROJE YAPISI OK"

      - name: APK derle
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: APK kontrol
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ls -lh app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: CIO-Score-0.8.9-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
